title: Cirrostratus
description: "Freelance AWS consultant helping small product teams fix their cloud infrastructure — architecture, cost optimization, DevOps, and IaC done right."
tagline: "AWS Consulting for Small Teams"
remote_theme: pages-themes/hacker@v0.2.0
url: "https://www.cirrostratus.cloud"

author:
  name: Yannick Van Rooyen
  email: contact@cirrostratus.cloud

# Open Graph defaults
logo: /assets/img/yannick_small.jpeg
locale: en_US

# Navigation
navigation:
  - title: Home
    url: /
  - title: Services
    url: /services
    dropdown:
      - title: AWS for Startups
        url: /services/aws-for-startups
      - title: AWS Sovereign Cloud
        url: /services/aws-sovereign-cloud
  - title: Blog
    url: /blog
  - title: About
    url: /about
  - title: Contact
    url: /contact

# Blog settings
permalink: /:title/
paginate: 5
paginate_path: "/blog/page:num/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-remote-theme

# SEO
linkedin:
  username: yannickvanrooyen
github:
  username: yannickvr
twitter:
  card: summary_large_image

# Collections
collections:
  posts:
    output: true
    permalink: /:title/

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge