{% if site.google_analytics %}
<!-- Google Analytics with Consent Mode v2 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  // Consent Mode v2: default every signal to denied until the visitor opts in (GDPR/EU).
  // With storage denied, gtag.js sets NO cookies and stores no identifiers, but still
  // sends anonymous, cookieless pings so Google can model aggregate traffic.
  gtag('consent', 'default', {
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    ad_storage: 'denied',
    analytics_storage: 'denied',
    wait_for_update: 500
  });

  // If the visitor already granted consent on a previous visit, restore it before config.
  try {
    if (localStorage.getItem('cs-consent') === 'granted') {
      gtag('consent', 'update', {
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        ad_storage: 'granted',
        analytics_storage: 'granted'
      });
    }
  } catch (e) {}

  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

{% seo %}

  "description": "Freelance AWS consultant helping small product teams fix their cloud infrastructure — architecture, cost optimization, DevOps, and Infrastructure as Code.",
  "url": "https://www.cirrostratus.cloud",
  "founder": {
    "@type": "Person",
    "name": "Yannick Van Rooyen",
    "jobTitle": "Senior DevOps Engineer & AWS Specialist",
    "url": "https://www.linkedin.com/in/yannickvanrooyen/"
  },
  "serviceType": ["AWS Consulting", "DevOps Consulting", "Cloud Architecture", "Infrastructure as Code", "Cost Optimization"],
  "areaServed": "Worldwide",
  "email": "contact@cirrostratus.cloud",
  "sameAs": [
    "https://www.linkedin.com/in/yannickvanrooyen/",
    "https://github.com/yannickvr"
  ]
}
</script>
{% endif %}

{% if page.layout == "default" and page.date %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | truncate: 160 | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Yannick Van Rooyen",
    "url": "https://www.linkedin.com/in/yannickvanrooyen/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Cirrostratus",
    "url": "https://www.cirrostratus.cloud"
  },
  "mainEntityOfPage": "{{ page.url | absolute_url }}"
  {% if page.image %},
  "image": "{{ page.image }}"
  {% endif %}
}
</script>
{% endif %}
